<rect x="60" y="815" width="1280" height="100" rx="16" fill="#ecfdf5" stroke="#86efac"/>
<text x="95" y="860" font-size="22" font-weight="700" fill="#166534">Tests passed: analytics helper and HTML analytics contract suites</text>
