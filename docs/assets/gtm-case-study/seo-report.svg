  <text x="66" y="165" font-family="Arial, sans-serif" font-size="18" fill="#475569">Total clicks</text>
  <text x="66" y="210" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#2563eb">27</text>
  <text x="250" y="165" font-family="Arial, sans-serif" font-size="18" fill="#475569">Total impressions</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#7c3aed">4.95k</text>
