  <text x="820" y="350" font-family="Arial, sans-serif" font-size="16" fill="#475569">Clicks varied while impressions remained broadly stable.</text>

  <line x1="38" y1="415" x2="1538" y2="415" stroke="#cbd5e1" stroke-width="2"/>
  <text x="38" y="465" font-family="Arial, sans-serif" font-size="24" font-weight="700">Week 2: 12–18 May 2026</text>
