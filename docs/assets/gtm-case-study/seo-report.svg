<svg xmlns="http://www.w3.org/2000/svg" width="1576" height="1609" viewBox="0 0 1576 1609">
  <title>Weekly SEO baseline comparison from Google Search Console</title>
  <desc>Sanitized comparison of 5–11 May 2026 and 12–18 May 2026 showing clicks, impressions, CTR, average position, charts, and queries.</desc>
  <rect width="1576" height="1609" fill="white"/>
