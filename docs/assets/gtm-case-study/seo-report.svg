  <text x="66" y="535" font-family="Arial, sans-serif" font-size="18" fill="#475569">Total clicks</text>
  <text x="66" y="580" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#2563eb">21</text>
  <text x="250" y="535" font-family="Arial, sans-serif" font-size="18" fill="#475569">Total impressions</text>
  <text x="250" y="580" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#7c3aed">4.96k</text>
  <text x="485" y="535" font-family="Arial, sans-serif" font-size="18" fill="#475569">Average CTR</text>
  <text x="485" y="580" font-family="Arial, sans-serif" font-size="42" font-weight="700">0.4%</text>
