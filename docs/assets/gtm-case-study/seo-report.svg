  <text x="485" y="210" font-family="Arial, sans-serif" font-size="42" font-weight="700">0.5%</text>
  <text x="66" y="280" font-family="Arial, sans-serif" font-size="18" fill="#475569">Average position</text>
  <text x="66" y="325" font-family="Arial, sans-serif" font-size="42" font-weight="700">12.4</text>
  <text x="250" y="280" font-family="Arial, sans-serif" font-size="18" fill="#475569">Top query examples</text>
  <text x="250" y="315" font-family="Arial, sans-serif" font-size="20">vcard qr generator</text>
  <text x="250" y="345" font-family="Arial, sans-serif" font-size="20">free vcard qr code generator</text>
  <rect x="790" y="120" width="748" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="820" y="165" font-family="Arial, sans-serif" font-size="18" fill="#475569">Observed pattern</text>
  <polyline points="830,320 930,285 1030,220 1130,280 1230,295 1330,255 1495,315" fill="none" stroke="#2563eb" stroke-width="5"/>
