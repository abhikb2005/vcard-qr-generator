name: Deploy Cloudflare Workers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json in repo root - skipping npm install"
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile found - using npm ci"
            npm ci
          else
            echo "No lockfile found - using npm install"
            npm install
          fi

      - name: Build (if present)
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "No package.json in repo root - skipping build"
          fi

      - name: Install Wrangler CLI
        run: npm install -g wrangler@4.58.0

      - name: Validate Cloudflare Secret Availability
        id: cloudflare-secrets
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN is missing or empty. Skipping deployment to prevent build failure."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning ::CLOUDFLARE_ACCOUNT_ID is missing or empty. Skipping deployment to prevent build failure."
            missing=1
          fi
          if [ "$missing" -eq 0 ] && ! wrangler whoami >/dev/null 2>&1; then
            echo "::warning ::Cloudflare authentication preflight failed. Skipping deployment to prevent noisy workflow failure."
            missing=1
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Workers
        if: steps.cloudflare-secrets.outputs.missing != '1'
        # Cloudflare preserves Worker secrets on deploy. Provision or rotate the
        # payment key separately; a code release should never rewrite it.
        run: wrangler deploy --keep-vars
