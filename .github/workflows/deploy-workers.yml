name: Deploy Cloudflare Workers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json in repo root - skipping npm install"
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile found - using npm ci"
            npm ci
          else
            echo "No lockfile found - using npm install"
            npm install
          fi

      - name: Build (if present)
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "No package.json in repo root - skipping build"
          fi

      - name: Install Wrangler CLI
        run: npm install -g wrangler@4.58.0

      - name: Validate Cloudflare Secret Availability
        id: cloudflare-secrets
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN is missing or empty. Skipping deployment to prevent build failure."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning ::CLOUDFLARE_ACCOUNT_ID is missing or empty. Skipping deployment to prevent build failure."
            missing=1
          fi
          if [ "$missing" -eq 0 ] && ! wrangler whoami >/dev/null 2>&1; then
            echo "::warning ::Cloudflare authentication preflight failed. Skipping deployment to prevent noisy workflow failure."
            missing=1
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Workers
        if: steps.cloudflare-secrets.outputs.missing != '1'
        env:
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_PAYMENTS_API_KEY }}
        run: |
          # show installed wrangler version for debugging
          wrangler --version || true
          # keep payment verification available without printing or committing the key
          if [ -n "${DODO_API_KEY:-}" ]; then
            printf "%s" "$DODO_API_KEY" | wrangler secret put DODO_API_KEY
          elif [ -n "${DODO_PAYMENTS_API_KEY:-}" ]; then
            printf "%s" "$DODO_PAYMENTS_API_KEY" | wrangler secret put DODO_API_KEY
          else
            echo "DODO_API_KEY/DODO_PAYMENTS_API_KEY GitHub secret not configured; payment verification endpoint will report unavailable."
          fi
          # run deploy; if wrangler.toml exists it will pick account_id automatically
          if [ -f wrangler.toml ]; then
            wrangler deploy
          else
            wrangler deploy --account-id $CLOUDFLARE_ACCOUNT_ID
          fi
